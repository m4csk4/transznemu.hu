# nginx config for transznemu.hu (Hugo static site).
# Both vhosts only accept connections proxied through Cloudflare; direct hits
# get 403. The Cloudflare-only logic and the shared serving rules live in
# snippets/ so the two server blocks stay identical except for root/server_name.
#
# Builds (see config/_default + config/development):
#   hugo                              -> public/      (https://transznemu.hu/)
#   hugo --environment development    -> public-dev/  (https://dev.transznemu.hu/)
#
# Install (Debian/Ubuntu layout):
#   ln -s /root/transznemu.hu/nginx/transznemu.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Cloudflare IP ranges in snippets/ are regenerated by
# scripts/update-cloudflare-ips.sh.

# --- production -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name transznemu.hu www.transznemu.hu;

    root /root/transznemu.hu/public;

    access_log /var/log/nginx/transznemu.access.log;
    error_log  /var/log/nginx/transznemu.error.log;

    include /root/transznemu.hu/nginx/snippets/site-common.conf;
}

# --- dev / staging ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev.transznemu.hu;

    root /root/transznemu.hu/public-dev;

    access_log /var/log/nginx/dev.transznemu.access.log;
    error_log  /var/log/nginx/dev.transznemu.error.log;

    include /root/transznemu.hu/nginx/snippets/site-common.conf;
}

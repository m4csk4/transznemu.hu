# Shared serving rules for transznemu.hu sites (prod + dev).
# `root` and logging are set per-server before including this.

index index.html;

# Restore the visitor's real IP, then allow only Cloudflare edge IPs.
include /root/transznemu.hu/nginx/snippets/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;
include /root/transznemu.hu/nginx/snippets/cloudflare-allow.conf;
deny all;

location / {
    try_files $uri $uri/ =404;
}

# Long-cache static assets.
location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

name: Refresh OSM toilet data

# Regenerates data/budik.json (the Budikereső map data) from the OpenStreetMap
# Overpass API, commits it if it changed, and then kicks off a deploy.
#
# Triggers:
#   - schedule           → weekly, keeps the map fresh
#   - workflow_dispatch   → run it on demand from the Actions tab
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed data/budik.json
  actions: write    # dispatch the Deploy workflow

# Don't overlap refreshes (a scheduled + a manual run at once, say).
concurrency:
  group: refresh-osm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed — this job only touches data/.

      # curl and jq are both preinstalled on ubuntu-latest runners.
      - name: Fetch latest toilets from Overpass
        run: ./scripts/fetch-budik.sh

      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- data/budik.json; then
            echo "No changes to data/budik.json — nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/budik.json
            git commit -m "data: refresh Budikereső toilets from OpenStreetMap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not fire the `push` event, so the
      # Deploy workflow won't start on its own. workflow_dispatch IS allowed
      # from GITHUB_TOKEN, so dispatch it explicitly — only when data changed.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

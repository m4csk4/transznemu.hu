baseURL = 'https://transznemu.hu/'
locale = 'hu'
title = 'transznemu.hu'
theme = 'PaperMod'

[params]
    # A címlapon az első bejegyzés is ugyanúgy nézzen ki, mint a többi (ne legyen kiemelve).
    disableSpecial1stPost = true

    [params.assets]
        # Egyetlen PNG minden ikonméretre – így nincs 404 a téma alapértelmezett útvonalaira.
        favicon = '/favicon.png'
        favicon16x16 = '/favicon.png'
        favicon32x32 = '/favicon.png'
        apple_touch_icon = '/favicon.png'
        safari_pinned_tab = '/favicon.png'

    [params.betaBanner]
        enable = true
        # Növeld a verziót, ha a szöveg változik – akkor újra megjelenik azoknak is, akik már bezárták.
        version = '1'
        text = 'Ez az oldal még egy kísérleti változat. Vannak benne hibák és sokminden instabilan működik. A forráskód nem elhanyagolható része LLM asszisztálásával készült.'
    [params.footer]
        text = '[Forráskód](https://github.com/m4csk4/transznemu.hu)'
    [params.contact]
        email = 'juli@transznemu.hu'

[[menu.main]]
name = 'Budikereső'
url = '/budikereso/'
weight = 10

